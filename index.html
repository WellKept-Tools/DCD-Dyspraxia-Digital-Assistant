const PREF_OPTIONS = {lang:LANGUAGES.map(row=>row[0]),theme:THEMES.map(row=>row[0]),mode:['light','dark'],size:['100','112.5','125','150'],font:['system','humanist','serif','mono'],spacing:['comfortable','spacious'],controls:['standard','large'],motion:['off','gentle','standard'],art:['transparent','cream','off']};
const namespace = `wellkept-dcd-${BUILD.edition}`;
const prefKey = `${namespace}-prefs`;
const dataKey = `${namespace}-data`;
let prefs = {...PREF_DEFAULTS}, state, db, storageMode = 'memory', storageMessage = 'saving';
let writeQueue = Promise.resolve(), unreadable = false;

function t(key, values = {}) {
  return (dictionary[key]?.[prefs.lang] || dictionary[key]?.en || key).replace(/\{(\w+)\}/g, (match, name) => values[name] ?? match);
}

function cleanPrefs(input, base = PREF_DEFAULTS) {
  const result = {...PREF_DEFAULTS, ...base};
  if (!input || typeof input !== 'object') return result;
  for (const [key, value] of Object.entries(PREF_DEFAULTS)) {
    const incoming = input[key];
    if (PREF_OPTIONS[key]?.includes(incoming)) result[key] = incoming;
    else if (typeof value === 'boolean' && typeof incoming === 'boolean') result[key] = incoming;
    else if (key === 'volume' && Number.isFinite(incoming)) result[key] = Math.min(100, Math.max(0, incoming));
    else if (key === 'displayName' && typeof incoming === 'string') result[key] = incoming.slice(0, 60);
  }
  return result;
}

function initDB() {
  return new Promise((resolve, reject) => {
    if (!globalThis.indexedDB) {reject(new Error('storage')); return;}
    const request = indexedDB.open(namespace, 1);
    request.onupgradeneeded = () => request.result.createObjectStore('content');
    request.onsuccess = () => resolve(request.result);
    request.onerror = request.onblocked = () => reject(request.error || new Error('storage'));
  });
}

function dbRequest(mode, method, ...args) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction('content', mode);
    const request = tx.objectStore('content')[method](...args);
    tx.oncomplete = () => resolve(request.result);
    tx.onerror = tx.onabort = () => reject(tx.error);
  });
}

async function loadState() {
  try {prefs = cleanPrefs(JSON.parse(localStorage.getItem(prefKey)));} catch {}
  applyPrefs();
  let raw;
  try {
    db = await initDB();
    raw = await dbRequest('readonly', 'get', 'state');
    storageMode = 'database';
  } catch {}
  if (raw == null) {
    try {
      const local = localStorage.getItem(dataKey);
      raw = local === null ? null : JSON.parse(local);
      if (storageMode === 'memory') {
        localStorage.setItem(`${dataKey}-probe`,'1');
        localStorage.removeItem(`${dataKey}-probe`);
        storageMode = 'local';
      }
    } catch {
      try {unreadable = localStorage.getItem(dataKey) !== null;} catch {}
    }
  }
  if (raw != null) {
    try {state = loadEdition(raw);} catch {unreadable = true;}
  }
  if (!state) state = initialState();
  storageMessage = unreadable ? 'damaged' : storageMode === 'memory' ? 'unsaved' : 'saved';
}

async function persistSnapshot(snapshot) {
  if (storageMode === 'database') {
    await dbRequest('readwrite', 'put', snapshot, 'state');
    try {localStorage.removeItem(dataKey);} catch {}
  } else if (storageMode === 'local') localStorage.setItem(dataKey, JSON.stringify(snapshot));
  else throw new Error('storage');
}

function saveState({recover = false} = {}) {
  if (unreadable && !recover) {setSaveState('damaged'); return Promise.resolve(false);}
  const snapshot = structuredClone(state);
  setSaveState('saving');
  writeQueue = writeQueue.then(async () => {
    try {
      await persistSnapshot(snapshot);
      unreadable = false;
      setSaveState('saved');
      return true;
    } catch {
      setSaveState('unsaved');
      return false;
    }
  });
  return writeQueue;
}

function setSaveState(message) {
  const changed = message !== storageMessage;
  storageMessage = message;
  const element = $('.save-state');
  if (element) element.textContent = t(message);
  const warning = $('#storage-warning');
  if (warning) {
    warning.hidden = !['unsaved','damaged'].includes(message);
    warning.textContent = t(message);
  }
  if (changed && ['unsaved','damaged'].includes(message)) announce(t(message));
}

function storePrefs() {
  try {localStorage.setItem(prefKey, JSON.stringify(prefs));} catch {setSaveState('unsaved');}
}

function applyPrefs() {
  const root = document.documentElement;
  root.lang = prefs.lang;
  for (const key of ['theme','mode','size','font','spacing','controls','contrast','solid','motion','art']) root.dataset[key] = prefs[key];
}

function panel(label, body, options = {}) {
  return `<section class="panel ${options.className || ''}" ${options.attr || ''}><div class="panel-title">${options.icon ? `<span class="tile-icon">${icon(options.icon)}</span>` : ''}<h2>${e(options.title || t(label))}</h2>${options.trailing || ''}</div>${body}</section>`;
}

function field(key, name, value = '', options = {}) {
  const {type = 'text', list, attrs = '', hint = ''} = options;
  const control = list ? `<select name="${name}" ${attrs}>${list.map(([id,label])=>`<option value="${e(id)}" ${String(value)===String(id)?'selected':''}>${e(label)}</option>`).join('')}</select>` :
    type === 'textarea' ? `<textarea name="${name}" ${attrs}>${e(value)}</textarea>` : `<input type="${type}" name="${name}" ${type==='file'?'':`value="${e(value)}"`} ${attrs}>`;
  return `<label class="field"><span>${e(t(key))}</span>${control}${hint ? `<small>${e(t(hint))}</small>` : ''}</label>`;
}

function checkbox(key,name,value,attrs = '') {

function empty(key) {return `<p class="empty">${e(t(key))}</p>`;}

function updateModeToggle() {

  $('#skip').textContent = t('skipContent');
  $('#sidebar').innerHTML = `${brand()}<nav class="side-nav" aria-label="${e(t('mainNav'))}">${editionNav.map(navButton).join('')}</nav>${maker()}`;
  $('#bottom').setAttribute('aria-label', t('mainNav'));

  const languages = LANGUAGES.map(([id, label])=>`<option value="${id}" lang="${id}" ${prefs.lang===id?'selected':''}>${e(label)}</option>`).join('');
  $('#topbar').innerHTML = `${brand()}<span class="save-state">${e(t(storageMessage))}</span><div class="top-controls"><select id="top-language" class="control" data-pref="lang" aria-label="${e(t('language'))}">${languages}</select><button id="mode-toggle" type="button" class="button" data-action="toggle-mode" aria-label="${e(t('darkMode'))}" title="${e(t('colorMode'))}"></button><button type="button" class="button primary" data-action="quick" aria-label="${e(t('quickAdd'))}">${icon('plus')}<span class="quick-label">${e(t('quickAdd'))}</span></button></div>`;
  if (BUILD.edition === 'demo') {
    $('#topbar').insertAdjacentHTML('beforeend', `<p class="demo-banner"><strong>${e(t('demoEdition'))}</strong> <span>${e(t('demoBanner'))}</span></p>`);

function renderPage(focus = false) {
  const warning = `<p id="storage-warning" class="panel form-error" ${['unsaved','damaged'].includes(storageMessage)?'':'hidden'}>${e(t(storageMessage))}</p>`;
  $main.innerHTML = warning + (views[route] || views.today)();
  $main.setAttribute('aria-busy', 'false');
  updateClock();
  if (focus) {
    window.scrollTo(0,0);
    $main.focus({preventScroll:true});
  }
}

function refresh() {
  const active = document.activeElement;
  const token = active?.dataset.action;
  const id = active?.dataset.id;
  renderPage();
  if (token && !$('#modal').open) {
    const replacement = $$('[data-action]', $main).find(node => node.dataset.action === token && node.dataset.id === id);
    if (replacement) replacement.focus({preventScroll:true});
    else if (!document.contains(active)) $main.focus({preventScroll:true});
  }
}

function navigate(key) {
  if (lockedRoutes.has(key)) return showLocked(key);
  if (!views[key]) return;
  if ($('#modal').open) closeModal();
  stopSpeech();
  route = key;
  renderShell();
  renderPage(true);
}

function announce(text) {$('#announce').textContent = text;}

function notify(key, undo, values) {
  clearTimeout(toastTimeout);
  undoAction = undo;
  const node = $('#notice');
  node.innerHTML = `<span>${e(t(key, values))}</span>${undo ? btn('undo','undo') : ''}`;
  node.hidden = false;
  announce(t(key, values));
  toastTimeout = setTimeout(()=> {node.hidden=true; undoAction=null;}, undo ? 18000 : 4200);
}

function openModal(title, body) {
  const dialog = $('#modal');
  if (!dialog.open) modalReturn = document.activeElement;
  dialog.innerHTML = `<header class="dialog-head"><h2 id="dialog-title">${e(title)}</h2>${btn('close','close','','','close',`aria-label="${e(t('close'))}"`)}</header>${body}`;
  if (!dialog.open) dialog.showModal();
  ($('[autofocus]',dialog) || $('input:not([type=hidden]),textarea,select',dialog) || $('.dialog-head button',dialog)).focus();
}

function closeModal() {
  $('#modal').close();
  modalConfirmation = null;
  if (modalReturn && document.contains(modalReturn)) modalReturn.focus({preventScroll:true});
}

function editModal(title, action, fields, id = '', submit = 'save') {
  openModal(t(title), `<form class="stack" data-submit="${action}" data-id="${e(id)}">${fields}<p class="form-error" role="alert" hidden></p><div class="actions">${btn('cancel','close')}<button class="button primary" type="submit">${e(t(submit))}</button></div></form>`);
}

function confirmDialog(key, run, label = 'delete') {
  modalConfirmation = run;
  openModal(t(key), `<div class="actions">${btn('cancel','close','','','', 'autofocus')}${btn(label,'confirm','','danger')}</div>`);
}

function showLocked(key) {
  openModal(t(lockedRoutes.get(key)), message('locked'));
}

function removeFrom(list, id, name = 'deleted') {
  const index = list.findIndex(row=>row.id===id);
  if (index < 0) return;
  const [removed] = list.splice(index,1);
  saveState();
  refresh();
  notify(name, () => {if (!list.some(row=>row.id===id)) list.splice(Math.min(index,list.length),0,removed); saveState(); refresh();});
}

function updatePreference(key, val) {
  prefs = cleanPrefs({[key]:val},prefs);
  applyPrefs();
  storePrefs();
  if (key === 'mode') {
    updateModeToggle();
    const select = $('[data-pref="mode"]');
    if (select) select.value = prefs.mode;
  }
  if (key === 'art') for (const image of $$('[data-art-key]')) image.src = BUILD.art[image.dataset.artKey][prefs.art === 'cream' ? 1 : 0];
  if (key === 'theme') announce(`${t('selected')}: ${THEMES.find(row=>row[0]===prefs.theme)[1]}`);
  if (key === 'soundOn' && prefs.soundOn) initAudio();
}

function setPreference(input) {
  const key = input.dataset.pref;
  if (!Object.hasOwn(PREF_DEFAULTS,key)) return;
  const value = input.type === 'checkbox' ? input.checked : input.type === 'range' ? Number(input.value) : input.value;
  updatePreference(key, value);
  if (key === 'lang') {
    const fromTopbar = input.id === 'top-language';
    stopSpeech();
    renderShell();
    renderPage();
    $(fromTopbar ? '#top-language' : '#main [data-pref="lang"]')?.focus({preventScroll:true});
  }
}

}

function initAudio() {
  try {
    const Context = window.AudioContext || window.webkitAudioContext;
    if (!Context) return;
    audio ||= new Context();
    if (audio.state === 'suspended') audio.resume().catch(()=>{});
  } catch {}
}

function tone(kind, preview = false) {
  if (!audio || (!preview && (!prefs.soundOn || !prefs[kind]))) return;
  try {
    const oscillator = audio.createOscillator(), gain = audio.createGain();
    const start = audio.currentTime;
    const length = kind === 'hover' ? .055 : kind === 'click' ? .09 : .23;
    oscillator.type='sine';
    oscillator.frequency.value = {hover:350,click:483,completeSound:620,timerSound:560}[kind] || 480;
    gain.gain.setValueAtTime(0,start);
    gain.gain.linearRampToValueAtTime((prefs.volume/100) * (kind === 'hover' ? .025 : .09),start+.014);
    gain.gain.linearRampToValueAtTime(0,start+length);
    oscillator.connect(gain).connect(audio.destination);
    oscillator.start(start);
    oscillator.stop(start+length+.01);
  } catch {}
}

function speak(text) {
  if (!('speechSynthesis' in window)) return notify('noVoice');
  const voice = speechSynthesis.getVoices().find(item=>item.localService && item.lang.toLowerCase().startsWith(prefs.lang));
  if (!voice) return notify('noVoice');
  stopSpeech();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.voice = voice;
  utterance.lang = voice.lang;
  speechSynthesis.speak(utterance);
}

function stopSpeech() {if ('speechSynthesis' in window) speechSynthesis.cancel();}

function stepDots(length, current) {
  if (!prefs.stepProgress || length > 12) return '';
  return `<div class="steps" aria-hidden="true">${Array.from({length},(_,i)=>`<span class="${i<current?'passed':i===current?'current':''}">${i<current?'✓':i+1}</span>`).join('')}</div>`;
}

function stepFocus(title, items, position, identifier, isRoutine, complete) {

  const controls = [

    !complete && !last ? btn('skip','step-skip',identifier) : '',
    position && !complete ? btn('back','step-back',identifier) : '',
    btn(complete?'close':'pause','step-pause',identifier),
    !complete && !last && prefs.speech ? btn('read','read-step',identifier)+btn('stopReading','stop-speech') : '',
  ].join('');

function completedRows(records, from, to, kind = 'task') {
  const counts = new Map();
  for (const record of records) if (record.kind===kind) counts.set(record.day,(counts.get(record.day)||0)+1);
  const rows=[];
  for (let day=from; day<=to && rows.length<92; day=dayShift(day,1)) rows.push({label:formatDate(day), values:[counts.get(day)||0]});
  return rows;
}

function validTimer(timer) {
  return timer && ['ready','running','paused','ended'].includes(timer.status) &&
    ['total','left','end','started'].every(key=>Number.isFinite(timer[key])&&timer[key]>=0) && timer.total>=60000 && timer.total<=10800000 && timer.total%60000===0 && timer.left<=timer.total && (timer.status==='running'?timer.end>0:timer.end===0);
}

function routineSteps() {return ['checkTime','pack','checkKeys','ready'].map(key=>t(key));}

function elapsedTimer() {
  const timer = state.timer;
  return timer.end ? Math.max(0,timer.end-Date.now()) : timer.left;
}

function initialTimer(minutes = 5) {return {total:minutes*60000,left:minutes*60000,end:0,status:'ready',started:0};}

function updateClock() {
  if (!state?.timer) return;
  const timer = state.timer;
  if (timer.status === 'running' && elapsedTimer() === 0) {
    timer.end=0;
    timer.left=0;
    timer.status='ended';
    onTimerFinish(timer);
    saveState();
    tone('timerSound');
    notify('timeEnded');
    if (route === 'focus') refresh();
    return;
  }
  const display = $('#clock');
  if (display) {
    const secs = Math.ceil(elapsedTimer()/1000);
    display.textContent = timerDisplayHidden ? t('timeHidden') : `${String(Math.floor(secs/60)).padStart(2,'0')}:${String(secs%60).padStart(2,'0')}`;
  }
}

function timerStart() {
  const timer = state.timer;
  if (timer.status === 'running') return;
  if (timer.status === 'ended') {timer.left=timer.total;timer.started=0;}
  if (!timer.started) timer.started=Date.now();
  timer.end=Date.now()+timer.left;
  timer.status='running';
  saveState(); refresh();
}

function timerPause() {
  if (state.timer.status !== 'running') return;
  if (!elapsedTimer()) return updateClock();
  state.timer.left=elapsedTimer(); state.timer.end=0; state.timer.status='paused';
  saveState(); refresh();
}

function focusView(extra = '', controls = '') {

  return page('focus','focusIntro','focus')+`<section class="panel focus-view stack"><p class="eyebrow">${e(t(key))}</p><p id="clock" class="clock"></p><div class="actions">${mainButton}${btn('reset','timer-reset')}${controls}</div><div class="row" style="justify-content:center">${checkbox('hiddenCountdown','timerHidden',timerDisplayHidden,'data-change="timer-hide"')}</div>${extra}${message('timerLimit')}</section>`;
}

const palette = ['var(--primary)','var(--chart-secondary)','var(--chart-rose)','var(--chart-green)'];
function chart(type, label, rows, series = [t('amount')]) {
  if (!rows.some(row=>row.values.some(value=>value>0))) return panel(label,empty('noData'));
  const width=490, height=144, top=12, baseline=114, chartWidth=430;
  const max = Math.max(1,...rows.flatMap(row=>row.values));
  const marker = (body, description) => `<g class="plot-mark" tabindex="0" role="button" aria-label="${e(description)}" data-chart-value="${e(description)}"><title>${e(description)}</title>${body}</g>`;
  let plot='';
  if (type==='donut') {
    const sum=rows.reduce((n,row)=>n+row.values[0],0);
    const circumference=2*Math.PI*41;
    let offset=0;
    plot=rows.map((row,i)=>{
      const length=circumference*row.values[0]/sum;
      if (!length) return '';
      const svg=`<circle cx="245" cy="64" r="41" fill="none" stroke="${palette[i%4]}" stroke-width="24" stroke-dasharray="${length} ${circumference}" stroke-dashoffset="${-offset}" transform="rotate(-90 245 64)"/>`;
      offset+=length;
      return marker(svg,`${row.label}: ${number(row.values[0])}`);
    }).join('')+`<text x="245" y="70" text-anchor="middle" fill="var(--ink)" font-size="18" aria-hidden="true">${number(sum)}</text>`;
  } else {
    const step=chartWidth/rows.length;
    const x=i=>30+step*(i+.5), y=value=>baseline-(baseline-top)*value/max;
    plot=`<path class="axis" d="M30 ${baseline}h${chartWidth}M30 ${top}h${chartWidth}"/><text x="27" y="${baseline}" text-anchor="end" fill="var(--muted)" font-size="10">0</text><text x="27" y="${top+3}" text-anchor="end" fill="var(--muted)" font-size="10">${number(max)}</text>`;
    const labelIndexes=rows.length<4 ? rows.map((_,i)=>i) : [0,Math.floor((rows.length-1)/2),rows.length-1];
    plot+=labelIndexes.map(i=>`<text x="${Math.min(447,Math.max(43,x(i)))}" y="${baseline+18}" text-anchor="middle" fill="var(--muted)" font-size="10">${e(rows[i].label)}</text>`).join('');
    if (type==='line') plot+=`<polyline points="${rows.map((row,i)=>`${x(i)},${y(row.values[0])}`).join(' ')}" fill="none" stroke="var(--primary)" stroke-width="2.5"/>`;
    plot+=rows.map((row,i)=>row.values.map((value,s)=>{
      const description=`${row.label} · ${series[s]}: ${number(value)}`;
      if (type==='line') return marker(`<circle cx="${x(i)}" cy="${y(value)}" r="${rows.length>25?3:6}" fill="${palette[s]}"/>`,description);
      const w=Math.max(2,Math.min(39,step*.7/row.values.length));
      return marker(`<rect x="${x(i)-(row.values.length*w/2)+s*w}" y="${Math.min(baseline-2,y(value))}" width="${w-1>0?w-1:w}" height="${Math.max(2,baseline-y(value))}" rx="2" fill="${palette[s]}"/>`,description);
    }).join('')).join('');
  }
  const legend = type==='donut' ? rows.map((row,i)=>`<span class="pill"><span aria-hidden="true" style="color:${palette[i%4]}">●</span>${e(row.label)} · ${number(row.values[0])}</span>`).join('') : series.length > 1 ? series.map((name,i)=>`<span class="pill"><span aria-hidden="true" style="color:${palette[i]}">●</span>${e(name)}</span>`).join('') : '';
  const table=`<details><summary>${e(t('showValues'))}</summary><div class="table-wrap"><table><caption class="visually-hidden">${e(t(label))}</caption><thead><tr><th scope="col">${e(t(type==='donut'?'title':'date'))}</th>${series.map(name=>`<th scope="col">${e(name)}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr><th scope="row">${e(row.label)}</th>${row.values.map(value=>`<td>${number(value)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></details>`;
  return panel(label,`<div class="chart-interactive"><svg class="chart" viewBox="0 0 ${width} ${height}" role="group" aria-label="${e(t(label))}">${plot}</svg><p class="status-line small muted" aria-live="polite"></p></div>${legend?`<div class="row">${legend}</div>`:''}${table}`);
}

function showChartValue(mark) {
  const chartBox=mark.closest('.chart-interactive');
  $('.status-line',chartBox).textContent=mark.dataset.chartValue;
}

function actionDispatch(event) {
  const mark = event.target.closest('[data-chart-value]');
  if (mark) {showChartValue(mark);return;}
  const control = event.target.closest('[data-action]');
  if (!control || control.disabled) return;
  const handler = actions[control.dataset.action] || commonActions[control.dataset.action];
  if (handler) handler(control.dataset.id || '', control, event);
}

const submits = Object.create(null), changes = Object.create(null);
async function handleSubmit(event) {
  const form=event.target;
  if (!form.dataset.submit) return;
  event.preventDefault();
  const handler=submits[form.dataset.submit];
  if (!handler || form.dataset.busy) return;
  const data=new FormData(form);
  const error=$('.form-error',form);
  const submit=$('[type=submit]',form);
  form.dataset.busy='true';
  if (submit) submit.disabled=true;
  if (error) error.hidden=true;
  try {await handler(data,form.dataset.id || '',form);}
  catch (problem) {
    if (error) {error.hidden=false;error.textContent=t(problem.key || 'invalid');}
    else notify(problem.key || 'invalid');
  } finally {
    delete form.dataset.busy;
    if (submit) submit.disabled=false;
  }
}

function fail(key = 'invalid') {throw Object.assign(new Error(key),{key});}
function text(data,key,max=3000) {return String(data.get(key) || '').trim().slice(0,max);}
function required(data,key,max=140) {const value=text(data,key,max);if(!value) fail();return value;}
function int(data,key,max=1440) {return Math.max(0,Math.min(max,parseInt(data.get(key),10)||0));}

async function boot() {
  configureEdition();
  views.settings ||= ()=>settingsView();
  views.help ||= ()=>helpView();
  changes['timer-hide'] = input=>{timerDisplayHidden=input.checked;updateClock();};
  await loadState();
  afterLoad();
  renderShell(); renderPage();
  document.addEventListener('click', event=>{
    if (prefs.soundOn && event.isTrusted && event.target.closest('button:not(:disabled), select, .theme-card')) {initAudio();tone('click');}
    actionDispatch(event);
  });
  document.addEventListener('pointerover',event=>{
    const button=event.target.closest('button:not(:disabled),.theme-card');
    if(event.pointerType==='mouse' && button && !button.contains(event.relatedTarget) && Date.now()-lastHover>170) {lastHover=Date.now();tone('hover');}
    const mark=event.target.closest('[data-chart-value]');if(mark) showChartValue(mark);
  });
  document.addEventListener('focusin',event=>{const mark=event.target.closest('[data-chart-value]');if(mark) showChartValue(mark);});
  document.addEventListener('keydown',event=>{
    if ((event.key==='Enter'||event.key===' ') && event.target.matches('[data-chart-value]')) {event.preventDefault();showChartValue(event.target);}
  });
  document.addEventListener('submit',handleSubmit);
  document.addEventListener('change', event=>{
    const input=event.target;
    if (input.dataset.pref) setPreference(input);
    changes[input.dataset.change]?.(input);
  });
  $('#modal').addEventListener('cancel',event=>{event.preventDefault();closeModal();});
  $('#skip').addEventListener('click',event=>{event.preventDefault();$main.focus();$main.scrollIntoView();});
  document.addEventListener('visibilitychange',()=>{document.documentElement.dataset.hidden=document.hidden;updateClock();});
  setInterval(()=>{updateClock(); editionTick();},500);
}

const LIMITS = Object.freeze({active:3,steps:3,notes:1,minutes:5});
let focusId = '';

function initialState() {return {version:1,tasks:[],notes:[],routinePos:0,routinePaused:false,timer:initialTimer(LIMITS.minutes),records:[]};}
function loadEdition(raw) {
  if (raw?.version!==1 || !Array.isArray(raw.tasks) || !Array.isArray(raw.notes) || !Array.isArray(raw.records) || !validTimer(raw.timer)) fail();
  if (raw.tasks.filter(task=>!task.done).length>LIMITS.active || raw.notes.length>LIMITS.notes || raw.timer.total!==LIMITS.minutes*60000) fail();
  if (!raw.tasks.every(task=>typeof task.id==='string'&&typeof task.title==='string'&&Array.isArray(task.steps)&&task.steps.length<=LIMITS.steps&&task.steps.every(step=>typeof step==='string')&&Number.isInteger(task.pos)&&task.pos>=0&&task.pos<=task.steps.length&&typeof task.done==='boolean')) fail();
  if (!raw.notes.every(note=>typeof note.id==='string'&&typeof note.body==='string') || !raw.records.every(record=>validDay(record.day)&&record.kind==='task')) fail();
  if (!Number.isInteger(raw.routinePos)||raw.routinePos<0||raw.routinePos>4) fail();
  return raw;
}
function afterLoad() {}
function editionTick() {}
function onTimerFinish() {}

function editTask(id = '') {
  const task=state.tasks.find(item=>item.id===id);
  if (!task&&state.tasks.filter(item=>!item.done).length>=LIMITS.active) return notify('demoLimit');
  editModal(task?'edit':'addTask','task',field('title','title',task?.title,{attrs:'required maxlength="140"'})+field('stepsLabel','steps',task?.steps.join('\n'),{type:'textarea',attrs:'maxlength="540"',hint:'onePerLine'}),id);
}

function saveTask(data,id) {
  const title=required(data,'title'), steps=words(text(data,'steps',540));
  const task=state.tasks.find(item=>item.id===id);
  if (steps.length>LIMITS.steps || (!task&&state.tasks.filter(item=>!item.done).length>=LIMITS.active)) fail('demoLimit');
  if (task) Object.assign(task,{title,steps,pos:Math.min(task.pos,steps.length)});
  else state.tasks.push({id:uid(),title,steps,pos:0,done:false});
  closeModal(); saveState(); refresh();
}

function toggleTask(id, allowUndo = true) {
  const task=state.tasks.find(item=>item.id===id);
  if (!task) return;
  if(task.done&&state.tasks.filter(item=>!item.done).length>=LIMITS.active) return notify('demoLimit');
  task.done=!task.done;
  if (task.done) {state.records.push({id,kind:'task',day:localDay()});tone('completeSound');}
  else {const index=state.records.findLastIndex(record=>record.id===id);if(index>=0)state.records.splice(index,1);task.pos=0;}
  saveState();refresh();
  if (allowUndo&&task.done) notify('completed',()=>toggleTask(id,false));
}

function stepInfo(id) {
  if(id==='starter') return {title:t('leaving'),items:routineSteps(),pos:state.routinePos,done:state.routinePos>=4};
  const task=state.tasks.find(item=>item.id===id);
  return task&&{title:task.title,items:task.steps,pos:task.pos,done:task.done};
}

function moveStep(id, amount, done) {
  const current=stepInfo(id);
  if(!current)return;
  stopSpeech();
  const next=Math.max(0,Math.min(current.items.length,current.pos+amount));
  if(id==='starter') {
    state.routinePos=next;
    if(next===current.items.length&&current.pos<next) tone('completeSound');
  } else {
    const task=state.tasks.find(item=>item.id===id);
    task.pos=next;
    if(next===current.items.length&&done&&!task.done) return toggleTask(id);
    if(next<current.items.length&&task.done) {
      if(state.tasks.filter(item=>!item.done).length>=LIMITS.active){task.pos=current.pos;return notify('demoLimit');}
      task.done=false;
      const index=state.records.findLastIndex(record=>record.id===id);
      if(index>=0)state.records.splice(index,1);
    }
  }
  saveState();refresh();
}

    today:demoToday, routines:()=>page('routines','','routines')+panel('routine',starterCard()),
    notes:()=>page('notes','','notes')+panel('note',`<div class="stack">${state.notes[0]?`<p class="item">${e(state.notes[0].body)}</p>`:empty('noNotes')}<div class="actions">${btn(state.notes.length?'edit':'addNote','new-note')}${state.notes.length?btn('delete','delete-note',state.notes[0].id,'danger'):''}</div></div>`),
    focus:()=>focusView(), progress:()=>page('progress','','progress')+chart('bar','dailyCompletions',completedRows(state.records,dayShift(localDay(),-6),localDay())),
    help:()=>helpView(panel('demoEdition',message('demoHelp'))),
    step:()=>{const item=stepInfo(focusId);return item?stepFocus(item.title,item.items,item.pos,focusId,focusId==='starter',item.done):demoToday();},
  });
  Object.assign(actions,{
    'new-task':()=>editTask(),'edit-task':editTask,'toggle-task':toggleTask,
    'delete-task':id=>confirmDialog('confirmDelete',()=>removeFrom(state.tasks,id)),
    'new-note':editNote,'delete-note':id=>confirmDialog('confirmDelete',()=>removeFrom(state.notes,id)),
    'open-step':id=>{focusId=id;if(id==='starter'){state.routinePaused=false;saveState();}navigate('step');},
    'step-done':id=>moveStep(id,1,true),'step-skip':id=>moveStep(id,1,false),'step-back':id=>moveStep(id,-1,false),
    'step-pause':id=>{if(id==='starter'){state.routinePaused=true;saveState();}navigate(id==='starter'?'routines':'today');},
    'read-step':id=>{const info=stepInfo(id);if(info?.items[info.pos])speak(info.items[info.pos]);},
    'reset-routine':()=>confirmDialog('resetRoutine',()=>{state.routinePos=0;state.routinePaused=false;saveState();refresh();},'reset'),
  });
  submits.task=saveTask;submits.note=saveNote;
}

boot();</script>
</body>
</html>
